name: ناشر إنستغرام
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ig-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Latest queue
        run: git pull -q origin main
      - name: Publish due item
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_HOST: ${{ secrets.IG_HOST }}
          MAX_MINUTES: "25"
          GIT_PUSH: "1"
        run: |
          git config user.name "baghdad-offers-bot"
          git config user.email "bot@users.noreply.github.com"
          python3 publisher/ig_publish.py
      - name: Save queue state
        run: |
          git config user.name "baghdad-offers-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A queue
          git diff --cached --quiet || (git commit -m "نشر: تحديث الطابور" && git pull --rebase -q && git push)
